    <style>
        /* Configuration de base Tailwind et de la police Inter */
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Fond très léger et moderne */
            color: #1e293b; /* Texte gris foncé */
        }
        
        /* Styles CSS pour la structure de l'application */
        .app-shell {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Variables CSS pour les dimensions */
        :root {
            --sidebar-width: 280px; 
            --sidebar-collapsed-width: 0px; 
        }

        /* La barre latérale est fixe et utilise la propriété 'transform' pour l'animation de glissement */
        .sidebar {
            width: var(--sidebar-width);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease-in-out;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 50; 
            transform: translateX(0); 
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.05); 
        }

        /* Le contenu principal du chat s'adapte à la barre latérale */
        .chat-area {
            margin-left: var(--sidebar-width);
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex: 1; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #fff; 
        }

        /* --- MODE COLLAPSED (uniquement sur mobile, ou forcé par l'utilisateur) --- */
        body.sidebar-collapsed .sidebar {
            transform: translateX(calc(var(--sidebar-width) * -1));
        }

        body.sidebar-collapsed .chat-area {
            margin-left: 0;
        }

        /* --- NOUVEAUX STYLES D'ÉLÉMENTS --- */

        /* 1. Bouton Hamburger */
        .hamburger-icon {
            z-index: 60; 
            position: absolute;
            top: 1rem;
            left: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); 
        }

        /* 2. Style des bulles de message */
        .message-bubble {
            border-radius: 1.5rem; 
            max-width: 85%; 
            padding: 0.8rem 1.2rem;
            animation: fadeInUp 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
            /* white-space: pre-wrap; REMOVED: Managed by JS markdown render now */
            word-wrap: break-word; /* Ensure long words break */
        }
        .message.bot .message-bubble {
            border-bottom-left-radius: 0.5rem; 
            background-color: #e2e8f0; 
            color: #1e293b;
        }
        .message.user .message-bubble {
            border-bottom-right-radius: 0.5rem;
            background-color: #3b82f6; 
            color: #ffffff;
        }

        /* --- Rendu des blocs de code (Amélioration Pro) --- */
        .message-bubble pre {
            background-color: #1f2937; /* Gris très foncé pour le code */
            color: #f3f4f6; /* Texte clair */
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto; /* Permet le défilement horizontal */
            margin-top: 0.75rem;
            margin-bottom: 0.75rem;
            font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
            line-height: 1.4;
            font-size: 0.9rem;
            /* Pas de bordure pour les blocs de code en Markdown */
        }
        .message-bubble code {
            /* Le code inline est dans une bulle légèrement différente */
            background-color: rgba(0, 0, 0, 0.1); 
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-size: 0.9rem;
        }
        .message-bubble pre code {
            /* Réinitialiser pour le code dans un bloc <pre> */
            background-color: transparent; 
            padding: 0;
        }


        /* 3. Input Composer (Le plus "pro") */
        .composer {
            /* Ajustement pour un meilleur look desktop */
            padding: 1.5rem 3rem; 
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.05); 
        }
        .composer-input {
            border-radius: 9999px; 
            padding-top: 0.75rem;
            padding-bottom: 0.75rem;
            min-height: 48px;
            font-size: 1rem;
        }
        
        /* 4. Scrollbar (Style moderne et fin) */
        .messages::-webkit-scrollbar {
            width: 8px;
        }
        .messages::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        /* --- Animations et états des boutons (plus de vie) --- */
        .nav-item, .hamburger-icon, .send { transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .nav-item:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 15px rgba(59, 130, 246, 0.2); 
        }
        .nav-item:active, .hamburger-icon:active, .send:active { 
            transform: scale(0.95); 
            box-shadow: none; 
        }

        /* --- Style du Typing Indicator (plus pro) --- */
        .typing-dots { display: flex; align-items: center; gap: 4px; padding: 4px 0; }
        .typing-dot { 
            width: 8px; 
            height: 8px; 
            background-color: #3b82f6; 
            border-radius: 50%; 
            display: inline-block; 
            opacity: 0.8;
            animation: typing-pulse 1s infinite cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }
        @keyframes typing-pulse { 
            0%, 100% { transform: translateY(0); opacity: 0.8; } 
            50% { transform: translateY(-4px); opacity: 1; } 
        }


        /* --- RÉACTIVITÉ MOBILE (max-width: 768px) --- */
        @media (max-width: 768px) {
            /* 1. Toujours masqué sur mobile */
            .sidebar {
                transform: translateX(calc(var(--sidebar-width) * -1));
                box-shadow: none; 
            }
            body:not(.sidebar-collapsed) .sidebar {
                transform: translateX(0); 
            }
            
            /* 2. Le chat prend 100% de la largeur */
            .chat-area,
            body.sidebar-collapsed .chat-area {
                margin-left: 0;
            }
            
            /* 3. Positionner le bouton hamburger en haut à gauche du CHAT */
            .chat-header {
                position: relative; 
                padding-left: 4rem; 
                text-align: center;
            }
            .hamburger-icon {
                left: 1rem; 
                top: 0.75rem;
            }
            
            /* 4. Ajuster le padding de l'input et du chat */
            .composer {
                padding: 1rem 1rem; /* Très responsable sur mobile */
            }
            .messages {
                padding: 1rem;
            }
        }
        
        /* Animation du message à l'apparition */
        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>

    /**
     * @function saveMessages
     * Sauvegarde l'historique du chat dans localStorage.
     */
    function saveMessages() {
        try {
            localStorage.setItem(CHAT_KEY, JSON.stringify(chatHistory.filter(msg => !msg.isTyping)));
        } catch(e) {
            console.error("Erreur lors de la sauvegarde de l'historique :", e);

    /**
     * @function loadMessages
     * Charge l'historique du chat depuis localStorage.
     */
    function loadMessages() {
        try {
            const savedHistory = localStorage.getItem(CHAT_KEY);
            if (savedHistory) {
                chatHistory = JSON.parse(savedHistory);
            }
        } catch(e) {
            console.warn("Impossible de charger l'historique. Démarrage d'un nouveau chat.", e);
            chatHistory = [];
        }

        // Si l'historique est vide (nouveau chat ou échec du chargement), ajouter le message initial
        if (chatHistory.length === 0) {
            chatHistory.push(initialBotMessage);
        }

        // Afficher tous les messages chargés
        messagesContainer.innerHTML = '';
        chatHistory.forEach(msg => appendMessage(msg.kind, msg.text, false, false));
    }

    // --- RENDU MARKDOWN AVANCÉ (NOUVEAU ET TRÈS PRO) ---

    /**
     * @function renderMarkdown
     * Convertit le texte Markdown en HTML, avec gestion des blocs de code.
     * @param {string} markdownText - Le texte en Markdown.
     * @returns {string} Le texte converti en HTML.
     */
    function renderMarkdown(markdownText) {
        if (!markdownText) return '';

        // 1. Gérer les blocs de code (```) en premier pour éviter que les backticks internes ne soient traités
        const codeBlockRegex = /```(\w+)?\n([\s\S]*?)\n```/g;
        let htmlText = markdownText.replace(codeBlockRegex, (match, lang, code) => {
            // Langue non utilisée ici mais conservée dans la capture
            const escapedCode = code
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            return `<pre><code class="language-${lang || 'plaintext'}">${escapedCode}</code></pre>`;
        });

        // 2. Gérer le code inline (`)
        htmlText = htmlText.replace(/`([^`]+)`/g, (match, inlineCode) => {
            const escapedCode = inlineCode
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            return `<code>${escapedCode}</code>`;
        });
        
        // 3. Gérer les listes et autres blocs simples (non implémenté ici pour simplicité)
        // ...

        // 4. Gérer les sauts de ligne (doubles sauts pour paragraphes, simples sauts pour <br>)
        htmlText = htmlText.replace(/\n\n/g, '</p><p>');
        htmlText = htmlText.replace(/\n/g, '<br>');
        
        // 5. Gérer le gras (Bold, car ** est souvent utilisé par l'IA)
        htmlText = htmlText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        
        // 6. Encapsuler dans un paragraphe pour la mise en forme générale si ce n'est pas déjà un bloc de code
        if (!htmlText.startsWith('<pre>')) {
             htmlText = `<p>${htmlText}</p>`;
        }


        // Correction des p vides et début/fin non désirés
        htmlText = htmlText.replace(/<p><\/p>/g, '');
        htmlText = htmlText.replace(/^<p>/, ''); // Supprimer le p initial si c'est le seul contenu
        htmlText = htmlText.replace(/<\/p>$/, ''); // Supprimer le p final si c'est le seul contenu

        return htmlText.trim();
    }


    // --- GESTION DES MESSAGES DANS L'INTERFACE ---

    /**
     * @function appendMessage
     * Ajoute un nouveau message à la zone de messages.
     */
    function appendMessage(kind, text, isTyping = false, saveToHistory = true) {
        const wrap = document.createElement('div');
        wrap.className = `message ${kind} flex items-start w-full ${kind === 'user' ? 'justify-end' : 'justify-start'}`;

            avatar.className = 'avatar w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm mr-2 shadow-md flex-shrink-0';
            avatar.textContent = 'AI'; 
            wrap.appendChild(avatar);
            wrap.appendChild(bubble);

        } else { // kind === 'user'
            bubbleClasses.push('bg-blue-600', 'text-white');
            wrap.appendChild(bubble); 
        }

        bubble.className = bubbleClasses.join(' ');
        
        if (!isTyping) {
            // Utiliser la fonction de rendu Markdown pour afficher le texte
            bubble.innerHTML = renderMarkdown(text); 

            // Si ce n'est pas un message temporaire et qu'on doit sauvegarder
            if (saveToHistory) {
                 // Mise à jour de l'historique de l'état
                chatHistory.push({ kind, text });
                saveMessages();
            }

        } else {
            // Loader HTML (plus esthétique)
            bubble.innerHTML = `
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            bubble.classList.add('w-16'); 
        }
        
        messagesContainer.appendChild(wrap);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        return bubble;
    }
    
    function showLoader() {
        // Le loader n'est pas sauvegardé dans l'historique (saveToHistory = false implicite)
        return appendMessage('bot', null, true, false); 
    }

    /**
     * @function hideLoader
     * Remplace le loader par la réponse finale et sauvegarde.
     */
    function hideLoader(loaderBubble, finalContent) {
        // Retirer la classe de largeur minimale après la réponse
        loaderBubble.classList.remove('w-16'); 

        // Remplacer le contenu du loader
        if (!finalContent || finalContent.trim() === '') {
             loaderBubble.parentElement.remove();
        } else {
            // IMPORTANT : Utiliser le rendu Markdown final
            loaderBubble.innerHTML = renderMarkdown(finalContent); 
            
            // Ajouter la réponse finale à l'historique et sauvegarder
            chatHistory.push({ kind: 'bot', text: finalContent });
            saveMessages();
            
            loaderBubble.parentElement.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }
    }


    // --- LOGIQUE D'APPEL À L'API GEMINI ---

    /**
     * @function buildChatHistoryForAPI
     * Construit l'historique du chat pour l'API en excluant le message initial par défaut.
     */
    function buildChatHistoryForAPI() {
        // Convertit l'historique local ({kind, text}) en format API ({role, parts: [{text}]})
        return chatHistory
            .filter(msg => msg !== initialBotMessage) // Exclure le message de bienvenue, car il est dans systemInstruction
            .map(msg => ({
                role: msg.kind === 'user' ? 'user' : 'model', // Gemini utilise 'model' pour le bot
                parts: [{ text: msg.text }]
            }));
    }

    async function getAIResponse(userMessage) {
        const apiKey = GEMINI_API_KEY;
        if (!apiKey || apiKey.length < 30) {
            return "Erreur: La clé API Gemini n'est pas configurée ou est invalide. Veuillez la vérifier.";
        }

        const apiUrl = `${GEMINI_API_URL}/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
        
        // CONSTRUIRE L'HISTORIQUE COMPLET POUR L'API
        const contents = [...buildChatHistoryForAPI(), { role: 'user', parts: [{ text: userMessage }] }];

        const payload = {
            contents: contents, // ENVOI DE TOUT L'HISTORIQUE
            systemInstruction: {
                parts: [{ text: GEMINI_SYSTEM_INSTRUCTION }]
            },
        };

        const maxRetries = 5;
        for (let attempt = 0; attempt < maxRetries; attempt++) {
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.status === 429 && attempt < maxRetries - 1) {
                    const delay = Math.pow(2, attempt) * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    continue; 
                }

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    const errorMessage = errorData.error?.message || `Erreur API: ${response.status} ${response.statusText}`;
                    
                    if (response.status === 400 || response.status === 403) {
                         const customMessage = `Erreur de clé/quota (${response.status}): La clé API semble invalide, non autorisée, ou le quota a été dépassé. Vérifiez la clé ou votre compte Google AI Studio.`;
                         throw new Error(customMessage);
                    }
                    
                    throw new Error(errorMessage);
                }

                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                
                return text || "Aucune réponse textuelle reçue de l'API Gemini.";

            } catch (error) {
                if (error.message.includes("Failed to fetch") && attempt < maxRetries - 1) {
                    const delay = Math.pow(2, attempt) * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    continue;
                }
                throw error; 
            }
        }
        return "Échec de la communication après plusieurs tentatives. Vérifiez votre connexion ou l'état du service API.";
    }


    /**
     * @function handleSendMessage
     * Gère l'envoi du message par l'utilisateur.
     */
    async function handleSendMessage(e) {
        e.preventDefault();
        
        if (isRequesting) {
            console.warn("Requête en cours. Veuillez patienter.");
            return;
        }

        const userMessage = input.value.trim();
        if (!userMessage) return;

        // 1. Afficher le message utilisateur (et le sauvegarder)
        appendMessage('user', userMessage);
        
        // 2. Vider l'input et désactiver les contrôles
        input.value = '';
        input.disabled = true;
        sendButton.disabled = true;
        isRequesting = true;
        sendButton.classList.add('opacity-50', 'cursor-not-allowed');

        // 3. Afficher le loader du bot
        const loaderBubble = showLoader();

        try {
            // 4. Appeler l'API Gemini
            const aiResponse = await getAIResponse(userMessage);
            
            // 5. Remplacer le loader par la réponse finale (et la sauvegarder)
            hideLoader(loaderBubble, aiResponse);

        } catch (error) {
            // En cas d'erreur non gérée
            hideLoader(loaderBubble, `Désolé, une erreur est survenue lors de la communication avec l'IA. Détails: ${error.message}`);
        } finally {
            // 6. Réactiver les contrôles
            isRequesting = false;
            input.disabled = false;
            sendButton.disabled = false;
            sendButton.classList.remove('opacity-50', 'cursor-not-allowed');
            input.focus(); 
        }
    }


    // --- INITIALISATION ET LISTENERS ---

    document.addEventListener('DOMContentLoaded', function() {
        // 1. Restaurer l'état de la sidebar
        restoreSidebarState();
        
        // 2. Charger l'historique du chat (Nouveau)
        loadMessages();

        // 3. Listeners pour le basculement de la sidebar
        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', toggleSidebar);
        }
        if (sidebarClose) {
            sidebarClose.addEventListener('click', collapseSidebar);
        }

        // 4. Listener pour l'envoi de message
        composer.addEventListener('submit', handleSendMessage);
        
        // 5. Listener pour la réactivité (si l'utilisateur redimensionne)
        window.addEventListener('resize', restoreSidebarState);

        // 6. Initialisation : focus sur l'input
        input.focus();
    });
</script>
