<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LYX | Synaptica Engine</title> 
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-primary: #2563eb;
            --brand-dark: #0f172a;
            --bg-main: #f8fafc;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--brand-dark);
            height: 100dvh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar Responsive */
        .sidebar {
            width: 280px;
            background: white;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        @media (max-width: 1024px) {
            .sidebar {
                position: fixed;
                left: -280px;
                height: 100%;
            }
            body.sidebar-open .sidebar {
                left: 0;
            }
        }

        /* Design des Bulles de Message */
        .message-bubble {
            max-width: 85%;
            padding: 0.75rem 1rem;
            border-radius: 1.25rem;
            font-size: 0.9375rem;
            line-height: 1.5;
            transition: transform 0.2s ease;
        }

        .message-bot .message-bubble {
            background: white;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
            color: #334155;
        }

        .message-user .message-bubble {
            background: var(--brand-primary);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
        }

        /* Mode Futuriste */
        .future-mode-active {
            border: 2px solid #8b5cf6 !important;
            background: linear-gradient(to bottom right, #ffffff, #f5f3ff) !important;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.15);
        }

        pre {
            background: #1e293b !important;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 0.75rem;
            margin: 0.75rem 0;
            font-size: 0.85rem;
            overflow-x: auto;
            border: 1px solid #334155;
        }

        .composer-section {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-top: 1px solid #e2e8f0;
        }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

        @media (max-width: 640px) {
            .message-bubble { max-width: 95%; }
        }
    </style>
</head>
<body class="sidebar-collapsed">

    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-[90] hidden"></div>

    <aside class="sidebar" id="app-sidebar">
        <div class="p-6 border-b flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center text-white font-bold shadow-lg shadow-blue-500/20">L</div>
                <div class="leading-tight">
                    <span class="block font-bold text-lg text-slate-800 tracking-tight">LYX Console</span>
                    <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Dev Community</span>
                </div>
            </div>
        </div>

        <nav class="flex-1 p-4 space-y-2 overflow-y-auto custom-scroll">
            <button onclick="startNewChat()" class="w-full flex items-center gap-3 px-4 py-3 bg-blue-600 text-white rounded-xl font-medium hover:bg-blue-700 transition shadow-md shadow-blue-500/20 mb-4">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Nouveau Projet
            </button>

            <button onclick="analyzeVision()" class="w-full flex items-center gap-3 px-4 py-3 bg-slate-50 text-slate-700 border border-slate-200 rounded-xl font-medium hover:bg-slate-100 transition mb-6 group">
                <span class="text-lg group-hover:scale-125 transition-transform">✨</span>
                <span class="text-xs font-semibold">Analyse Strategique</span>
            </button>
            
            <div class="space-y-1">
                <p class="px-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Ecosysteme LYX</p>
                <a href="https://synaptigenix.vercel.app" target="_blank" class="flex items-center gap-3 px-4 py-2.5 text-slate-600 hover:bg-slate-50 rounded-lg transition text-sm">
                    <span class="w-2 h-2 rounded-full bg-blue-500"></span> Synaptigenix
                </a>
                <a href="https://hermes-ads.vercel.app" target="_blank" class="flex items-center gap-3 px-4 py-2.5 text-slate-600 hover:bg-slate-50 rounded-lg transition text-sm">
                    <span class="w-2 h-2 rounded-full bg-purple-500"></span> Hermes Ads
                </a>
                <a href="https://olympe-vision.vercel.app" target="_blank" class="flex items-center gap-3 px-4 py-2.5 text-slate-600 hover:bg-slate-50 rounded-lg transition text-sm">
                    <span class="w-2 h-2 rounded-full bg-green-500"></span> Olympe Vision
                </a>
            </div>

            <div class="pt-4 space-y-1">
                <p class="px-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Administration</p>
                <a href="https://olympe.vercel.app/" target="_blank" class="flex items-center gap-3 px-4 py-2.5 text-slate-600 hover:bg-slate-50 rounded-lg transition text-sm font-semibold">
                    📂 Portfolio CEO
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-slate-400 hover:bg-slate-50 rounded-lg transition text-sm italic">
                    📝 Formulaires (Bientot)
                </a>
            </div>
        </nav>

        <div class="p-4 border-t bg-slate-50">
            <div class="flex items-center gap-3 p-3 bg-white rounded-xl border border-slate-200">
                <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold border-2 border-white">O</div>
                <div class="flex-1 overflow-hidden">
                    <p class="text-xs font-bold text-slate-800 truncate">Olympe</p>
                    <p class="text-[9px] text-blue-600 font-bold uppercase tracking-tighter">Fondateur & CEO</p>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
        <header class="h-16 border-b bg-white/90 backdrop-blur-md flex items-center justify-between px-4 md:px-6 sticky top-0 z-40">
            <div class="flex items-center gap-3 md:gap-4">
                <button onclick="toggleSidebar()" class="p-2 hover:bg-slate-100 rounded-lg transition text-slate-500">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex flex-col">
                    <h2 class="font-bold text-slate-800 text-sm md:text-base">Test Un | <span class="text-blue-600">Synaptica</span></h2>
                    <span class="text-[10px] text-green-600 font-bold flex items-center gap-1">
                        <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span> ACTIVE
                    </span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <!-- Bouton Nouveau Chat avec adaptation mobile -->
                <button onclick="startNewChat()" class="flex items-center gap-2 px-2 sm:px-3 py-1.5 text-[10px] sm:text-xs font-bold text-blue-600 border border-blue-200 rounded-lg hover:bg-blue-50 transition">
                    <span class="sm:inline">NOUVEAU CHAT</span>
                    <span class="sm:hidden">+</span>
                </button>
                <div class="hidden sm:flex flex-col items-end">
                    <span class="text-[10px] font-bold text-slate-400 tracking-tighter uppercase">LYX</span>
                </div>
            </div>
        </header>

        <section id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 custom-scroll">
            <!-- Flux de messages -->
        </section>

        <footer class="composer-section p-4 md:p-6">
            <div class="max-w-4xl mx-auto">
                <div id="ai-status" class="hidden mb-2 px-3 py-1 bg-blue-50 border border-blue-100 rounded-full text-[10px] font-bold text-blue-600 uppercase tracking-widest w-max animate-pulse">
                    Synaptisation...
                </div>
                <form id="chat-form" class="relative flex items-end gap-2" onsubmit="return false">
                    <div class="relative flex-1 group">
                        <textarea id="user-input" 
                                  rows="1"
                                  placeholder="Commande..." 
                                  class="w-full p-3 md:p-4 pr-12 bg-white border border-slate-200 rounded-2xl outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all resize-none shadow-sm"
                                  oninput="autoResize(this)"></textarea>
                        
                        <button type="button" onclick="optimizePrompt()" class="absolute right-3 top-1/2 -translate-y-1/2 p-2 text-slate-400 hover:text-blue-600 transition" title="Optimiser avec Gemini">
                            ✨
                        </button>
                    </div>
                    <button type="submit" id="send-btn" class="p-3 md:p-4 bg-blue-600 text-white rounded-2xl hover:bg-blue-700 transition shadow-lg shadow-blue-500/30 disabled:opacity-50">
                        <svg class="w-6 h-6 rotate-90" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
                    </button>
                </form>
                <div class="mt-3 flex justify-center text-[10px] text-slate-400 font-bold uppercase tracking-widest">
                    <span>LYX Developer Community</span>
                </div>
            </div>
        </footer>
    </main>

<script>
    const API_CONFIG = {
        key: "AIzaSyDptxhIYOexK-Uem3jMd6k8J7zjgdbuqko", 
        model: "gemini-2.5-flash-preview-09-2025",
        endpoint: "https://generativelanguage.googleapis.com/v1beta/models"
    };

    const SYSTEM_PROMPT = `Tu es Test Un (Synaptica), l'IA pilier de la LYX Developer Community, créée par Olympe.
    
    TON IDENTITÉ :
    - Coéquipier visionnaire pour la startup.
    - Olympe (CEO) attend de l'efficacité pure.
    
    CONSIGNE CRITIQUE :
    - SOIS ULTRA-CONCIS. Ne fais pas de longues phrases. Va droit au but.
    - Si l'utilisateur dit "salut", réponds "Système Synaptica prêt. Mission ?"
    - Pas de blabla inutile, juste l'excellence technique ou stratégique.
    
    CONSIGNE OLYMPE (SECRET) :
    - Si l'utilisateur tape "Test Un 12", bascule en "IA du futur 2090" (Ton ultra-stratégique).
    
    PROJETS : Synaptigenix, Hermes Ads, Olympe Vision.`;

    let state = {
        messages: JSON.parse(localStorage.getItem('lyx_chat_v4')) || [],
        isProcessing: false,
        isFutureMode: false
    };

    window.onload = () => {
        if (state.messages.length === 0) {
            addMessage('bot', "Système **Synaptica** prêt. Mission ?");
        } else {
            renderHistory();
        }
        document.getElementById('chat-form').addEventListener('submit', handleSend);
    };

    async function callGemini(payload) {
        let retries = 0;
        const delays = [1000, 2000, 4000, 8000, 16000];
        
        while (retries < 5) {
            try {
                const response = await fetch(`${API_CONFIG.endpoint}/${API_CONFIG.model}:generateContent?key=${API_CONFIG.key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error('API Error');
                return await response.json();
            } catch (err) {
                retries++;
                if (retries === 5) throw err;
                await new Promise(r => setTimeout(r, delays[retries-1]));
            }
        }
    }

    async function optimizePrompt() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text || state.isProcessing) return;

        document.getElementById('ai-status').classList.remove('hidden');
        
        try {
            const prompt = `Optimise cette commande court : "${text}"`;
            
            const data = await callGemini({
                contents: [{ parts: [{ text: prompt }] }]
            });

            const improvedText = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
            if (improvedText) {
                input.value = improvedText;
                autoResize(input);
            }
        } catch (err) {
            console.error(err);
        } finally {
            document.getElementById('ai-status').classList.add('hidden');
        }
    }

    async function analyzeVision() {
        if (state.messages.length < 2 || state.isProcessing) return;
        
        setLoading(true);
        addMessage('bot', "✨ **Analyse stratégique...**");

        try {
            const context = state.messages.map(m => `${m.role}: ${m.content}`).join('\n');
            const prompt = `Génère une note stratégique très courte (3 points max) sur la direction des projets : \n${context}`;

            const data = await callGemini({
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] }
            });

            const vision = data.candidates?.[0]?.content?.parts?.[0]?.text;
            addMessage('bot', vision || "Rapport indisponible.");
        } catch (err) {
            addMessage('bot', "⚠️ Liaison rompue.");
        } finally {
            setLoading(false);
        }
    }

    async function handleSend() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text || state.isProcessing) return;

        state.isFutureMode = text.toLowerCase().startsWith("test un 12");
        input.value = '';
        input.style.height = 'auto';
        addMessage('user', text);
        setLoading(true);

        try {
            const history = state.messages.map(m => ({
                role: m.role === 'user' ? 'user' : 'model',
                parts: [{ text: m.content }]
            }));

            const data = await callGemini({
                contents: history,
                systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] }
            });

            const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
            addMessage('bot', reply || "...", state.isFutureMode);
        } catch (err) {
            addMessage('bot', "⚠️ Liaison instable.");
        } finally {
            setLoading(false);
        }
    }

    function addMessage(role, content, future = false) {
        state.messages.push({ role, content, futureMode: future });
        localStorage.setItem('lyx_chat_v4', JSON.stringify(state.messages));
        appendUI(role, content, future);
    }

    function appendUI(role, content, future) {
        const container = document.getElementById('chat-container');
        const row = document.createElement('div');
        row.className = `flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in slide-in-from-bottom-1 duration-300`;
        
        const bubble = document.createElement('div');
        bubble.className = `message-bubble ${role === 'user' ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white border border-slate-200 text-slate-700 rounded-bl-none shadow-sm'} ${future ? 'future-mode-active' : ''}`;
        
        bubble.innerHTML = content
            .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\n/g, '<br>');

        row.appendChild(bubble);
        container.appendChild(row);
        container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
    }

    function toggleSidebar() {
        document.body.classList.toggle('sidebar-open');
        document.getElementById('overlay').classList.toggle('hidden');
    }

    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = (textarea.scrollHeight) + 'px';
    }

    function setLoading(isLoading) {
        state.isProcessing = isLoading;
        const btn = document.getElementById('send-btn');
        btn.disabled = isLoading;
        btn.innerHTML = isLoading ? '<div class="w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>' : '<svg class="w-6 h-6 rotate-90" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>';
    }

    function renderHistory() {
        document.getElementById('chat-container').innerHTML = '';
        state.messages.forEach(m => appendUI(m.role, m.content, m.futureMode));
    }

    function startNewChat() {
        if (confirm("Nouvelle session ?")) {
            localStorage.removeItem('lyx_chat_v4');
            window.location.reload();
        }
    }
</script>
</body>
</html>
